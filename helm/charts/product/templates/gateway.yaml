{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.host }}{{ fail "gateway.host is required when gateway.enabled=true (set gateway.enabled=false to skip exposure)" }}{{ end }}
{{- $gw := default (printf "%s-gw" (include "product.name" .)) .Values.gateway.gatewayName }}
{{- if not .Values.gateway.gatewayName }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw }}
  labels: {{- include "product.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.host | quote }}
      tls:
        mode: Terminate
        options:
          networking.gke.io/pre-shared-certs: {{ include "product.name" . }}-cert
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "product.name" . }}
  labels: {{- include "product.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw }}
      {{- if .Values.gateway.gatewayNamespace }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      {{- end }}
  hostnames: [{{ .Values.gateway.host | quote }}]
  rules:
    - backendRefs:
        - { name: {{ include "product.name" . }}, port: 80 }
---
# GKE Gateway does not use readiness probes; health-check the app path explicitly.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "product.name" . }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: {{ .Values.probes.path }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "product.name" . }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "product.name" . }}-config
  labels: {{- include "product.labels" . | nindent 4 }}
data:
  {{- $data := merge (dict "CUSTOMER" .Values.customer "ENV" .Values.env "PRODUCT_VERSION" .Values.image.tag) (omit .Values.config "CUSTOMER" "ENV" "PRODUCT_VERSION") }}
  {{- range $k, $v := $data }}
  {{ $k | quote }}: {{ $v | quote }}
  {{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "product.name" . }}
  labels: {{- include "product.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "product.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # GKE Gateway / health-check proxies
        - ipBlock: { cidr: 130.211.0.0/22 }
        - ipBlock: { cidr: 35.191.0.0/16 }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . }} }
        {{- end }}
      ports:
        - { port: {{ .Values.containerPort }}, protocol: TCP }
{{- end }}
